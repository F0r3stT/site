    <div class="nav-links">
        <a href="#features" class="nav-link" onclick="scrollToFeatures()">How It Works</a>
        <a href="#services" class="nav-link" onclick="document.querySelector('.order-types-section').scrollIntoView({behavior: 'smooth'})">Services</a>
        <a href="#factories" class="nav-link">Factories</a>
        <a href="#pricing" class="nav-link">Pricing</a>
        
        <div class="user-menu" id="user-menu" style="display: none;">
            <div class="user-info">
                <div class="avatar" id="avatar-text">U</div>
                <div class="user-details">
                    <span class="user-name" id="user-name"></span>
                    <span class="user-role" id="user-role"></span>
                </div>
            </div>
            <div class="dropdown">
                <button class="btn btn-outline btn-sm" onclick="toggleDropdown(this)">
                    <i class="fas fa-chevron-down"></i>

                <div class="dropdown-content">
                    <a href="#profile" onclick="viewProfile()">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a href="#settings" onclick="viewSettings()">
                        <i class="fas fa-cog"></i> Settings

                    <div class="dropdown-divider"></div>

                        <i class="fas fa-sign-out-alt"></i> Logout

        <div class="auth-buttons" id="auth-buttons">
            <button class="btn btn-outline" onclick="showAuthModal('login')">

</nav>

<style>
    .dropdown {
        position: relative;
    }
    
    .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        background-color: white;
        min-width: 200px;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border-color);
        z-index: 1000;
        margin-top: 0.5rem;
    }
    
    .dropdown-content a {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        color: var(--dark-color);
        text-decoration: none;
        transition: background-color 0.2s;
    }
    
    .dropdown-content a:hover {
        background-color: var(--light-color);
    }
    
    .dropdown-divider {
        height: 1px;
        background-color: var(--border-color);
        margin: 0.5rem 0;
    }
    
    .user-details {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }
    
    .user-name {
        font-weight: 600;
        font-size: 0.875rem;
    }
    
    .user-role {
        font-size: 0.75rem;
        color: var(--gray-color);
        text-transform: capitalize;
    }
</style>

<script>
    function toggleDropdown(button) {
        const dropdown = button.nextElementSibling;
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }
    
    function initHeader() {
        // Закрытие выпадающих меню при клике вне
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown-content').forEach(dropdown => {
                    dropdown.style.display = 'none';
                });
            }
        });
    }
</script>
