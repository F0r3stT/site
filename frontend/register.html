<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - PCB Manufacturing Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="auth-page">
        <!-- Левая часть с изображением -->
        <div class="image-section">
            <div class="image-container">
                <img src="resources/PCBFABR.jpg" alt="PCB Manufacturing Process">
                <div class="image-overlay"></div>
                <div class="image-caption">
                    <h3>Advanced PCB Manufacturing</h3>
                    <p>Connect with manufacturers and streamline your electronics production with our secure platform.</p>
                </div>
            </div>
        </div>

        <!-- Правая часть с формой -->
        <div class="form-section">
            <div class="form-container">
                <div class="auth-header">
                    <h1 class="auth-title">Create Account</h1>
                    <p class="auth-subtitle">Sign up to access PCB manufacturing services</p>
                </div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-container">
                            <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
                            <div class="input-icon">
                                <i class="fas fa-user"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-container">
                            <input type="email" id="email" class="form-input" placeholder="your.email@example.com" required>
                            <div class="input-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-container">
                            <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                            <div class="input-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="country" class="form-label">Country</label>
                        <div class="select_wrapper">
                            <i class="fas fa-globe"></i>
                            <select class="country_selection" id="country" name="country">
                                <option value="" disabled selected hidden>Select your country...</option>
                                <option value="Armenia" data-icon="🇦🇲">Armenia</option>
                                <option value="Germany" data-icon="🇩🇪">Germany</option>
                                <option value="Ukraine" data-icon="🇺🇦">Ukraine</option>
                                <option value="USA" data-icon="🇺🇸">United States</option>
                                <option value="Australia" data-icon="🇦🇺">Australia</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-footer">
                        <label class="checkbox-container">
                            <input type="checkbox" class="Checkbox" checked="checked" name="remember">
                            <span class="checkbox-custom"></span>
                            <span class="checkbox-label">Remember me</span>
                        </label>
                        <button type="submit" class="auth-btn">
                            <span>Sign Up</span>
                            <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
                        </button>
                    </div>
                </form>

                <div class="divider">
                    <span>Or continue with</span>
                </div>

                <div class="social-auth">
                    <button class="social-btn google">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn linkedin">
                        <i class="fab fa-linkedin"></i>
                        <span>LinkedIn</span>
                    </button>
                </div>

                <div class="auth-footer">
                    <p>
                        <a href="index.html" class="GoBack">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                        Already have an account?
                        <a href="login.html" style="text-decoration: none;">
                            Sign In
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

    <script>
        // Обработка формы
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const payload = {
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
    role: "customer",
    country: document.getElementById("country").value
  };

  const password = document.getElementById("password").value;

if (password.length < 8) {
  alert("Password must be at least 8 characters");
  return;
}
  try {
    const res = await fetch(`${API_BASE_URL}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (res.ok) {
      alert("Registration успешна!");
      window.location.href = "login.html";
    } else if (data.error.includes("Password")) 
    alert("Пароль должен быть минимум 8 символов"); 

    else {
      alert(data.error || "Ошибка регистрации");
    }

  } catch (err) {
    alert("Network error: API недоступен");
  }
});


        
        // Анимация при фокусе на полях ввода
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });
        
        // Эффект для социальных кнопок
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const provider = this.classList.contains('google') ? 'Google' : 'LinkedIn';
                this.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Connecting...`;
                this.disabled = true;
                
                setTimeout(() => {
                    alert(`Connecting with ${provider} would be implemented here`);
                    this.innerHTML = `<i class="fab fa-${provider.toLowerCase()}"></i><span>${provider}</span>`;
                    this.disabled = false;
                }, 1000);
            });
        });
    </script>
</body>
</html>
